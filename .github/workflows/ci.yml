name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Pack
        run: dotnet pack src/grpc-mock-server --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
            **/TestResults/*.trx
